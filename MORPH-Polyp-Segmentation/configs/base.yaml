experiment: morph
seed: 1234
output_dir: runs/morph
data:
  geometry: 1024
  train_manifest: splits/local/train.csv
  development_fit_manifest: splits/local/development_fit.csv
  development_manifest: splits/local/development.csv
  test_manifests:
    kvasir: splits/local/test_kvasir.csv
    clinicdb: splits/local/test_clinicdb.csv
    colondb: splits/local/test_colondb.csv
    etis: splits/local/test_etis.csv
    endoscene: splits/local/test_endoscene.csv
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: [-10, 10]
  rotation_probability: 0.5
  intensity_perturbation: 0.1
  intensity_probability: 0.5
model:
  implementation: morph_aspect_pad_LH_HL_HH
  sam_checkpoint: checkpoints/sam_vit_b_01ec64.pth
  wavelet: haar
  wavelet_mode: symmetric
  wavelet_levels: 3
  interaction_blocks: [2, 5, 8, 11]
  activation_checkpointing: true
  activation_checkpointing_scope: global
  meaa_sources: [cnn, whfc, vit]
  aggregation: branch_softmax
  fusion: cbaf
  frequency_mode: morph_prompt
  click_radius: 5
train:
  phase: final
  epochs: 200
  batch_size: 2
  drop_last: true
  learning_rate: 0.01
  weight_decay: 1.0e-4
  scheduler_step: 50
  scheduler_gamma: 0.1
  prompt_mode: one_click
  bce_weight: 0.3
  dice_weight: 1.2
  dice_smooth: 1.0e-6
evaluation:
  threshold: 0.5
  prompt_seed: 1234
  boundary_width: 1
  metric_epsilon: 1.0e-7
execution:
  device: auto
  precision: float32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  log_every: 50
  gradient_clip_norm: null
  allow_tf32: false
  deterministic_warn_only: true
  fp32_batchnorm: false
  robust_batchnorm_layers: []
